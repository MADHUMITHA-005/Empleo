<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Empleo - Resume Preview</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="preview-actions">
    <button onclick="window.print()">Print / Save PDF</button>
    <a href="builder.html">Edit Resume</a>
</div>

<main class="resume" id="resumePreview">

    <header class="resume-header">

        <h1 id="previewName">Your Name</h1>

        <p id="previewContact"></p>

    </header>

    <section>
        <h2>Professional Summary</h2>
        <p id="previewSummary"></p>
    </section>

    <section>
        <h2>Education</h2>
        <p id="previewEducation"></p>
    </section>

    <section>
        <h2>Skills</h2>
        <p id="previewSkills"></p>
    </section>

    <section>
        <h2>Projects</h2>
        <p id="previewProjects"></p>
    </section>

    <section>
        <h2>Experience</h2>
        <p id="previewExperience"></p>
    </section>

    <section>
        <h2>Certifications</h2>
        <p id="previewCertifications"></p>
    </section>

    <section>
        <h2>Achievements</h2>
        <p id="previewAchievements"></p>
    </section>

</main>

<script src="script.js"></script>

</body>
</html>
